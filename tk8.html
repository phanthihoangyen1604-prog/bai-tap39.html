<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>TK8: Chuyển đổi màu Hex sang RGB</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        input { padding: 8px; }
        button { padding: 8px 15px; background: #4a90e2; color: white; border: none; cursor: pointer; }
        a { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #4a90e2; }
    </style>
</head>
<body>
    <a href="bt39.html">&larr; Quay lại trang chủ</a>
    <h2>Bài tập TK8: Chuyển đổi màu Hex sang RGB</h2>
    <input type="text" id="hexInput" placeholder="Ví dụ: #FF0000">
    <button onclick="hexToRgb()">Chuyển đổi</button>
    <p>Kết quả: <strong id="rgbResult"></strong></p>

    <script>
        function hexToRgb() {
            let hex = document.getElementById("hexInput").value.trim();
            if (hex.startsWith('#')) hex = hex.slice(1);
            if (hex.length === 3) {
                hex = hex.split('').map(c => c + c).join('');
            }
            let bigint = parseInt(hex, 16);
            let r = (bigint >> 16) & 255;
            let g = (bigint >> 8) & 255;
            let b = bigint & 255;
            document.getElementById("rgbResult").innerText = `rgb(${r}, ${g}, ${b})`;
        }
    </script>
</body>
</html>
