<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>TK5: Accordion đơn giản</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        .accordion { background-color: #eee; color: #444; cursor: pointer; padding: 18px; width: 100%; text-align: left; border: none; outline: none; font-size: 15px; transition: 0.4s; margin-bottom: 5px; }
        .active, .accordion:hover { background-color: #ccc; }
        .panel { padding: 0 18px; background-color: white; max-height: 0; overflow: hidden; transition: max-height 0.2s ease-out; border-left: 3px solid #4a90e2; }
        a { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #4a90e2; }
    </style>
</head>
<body>
    <a href="bt39.html">&larr; Quay lại trang chủ</a>
    <h2>Bài tập TK5: Accordion đơn giản</h2>
    
    <button class="accordion">Tiêu đề 1</button>
    <div class="panel"><p>Nội dung phần 1: Đây là đoạn văn bản ẩn hiện khi bạn bấm vào tiêu đề tương ứng.</p></div>

    <button class="accordion">Tiêu đề 2</button>
    <div class="panel"><p>Nội dung phần 2: Sử dụng classList.toggle() và max-height/transition trong CSS để tạo hiệu ứng mượt mà.</p></div>

    <script>
        var acc = document.getElementsByClassName("accordion");
        for (let i = 0; i < acc.length; i++) {
            acc[i].addEventListener("click", function() {
                this.classList.toggle("active");
                var panel = this.nextElementSibling;
                if (panel.style.maxHeight) {
                    panel.style.maxHeight = null;
                } else {
                    panel.style.maxHeight = panel.scrollHeight + "px";
                }
            });
        }
    </script>
</body>
</html>
